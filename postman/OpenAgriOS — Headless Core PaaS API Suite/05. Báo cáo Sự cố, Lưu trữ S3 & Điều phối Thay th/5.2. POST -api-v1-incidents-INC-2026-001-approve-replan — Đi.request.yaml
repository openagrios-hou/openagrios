$kind: http-request
name: 5.2. POST /api/v1/incidents/INC-2026-001/approve-replan — Điều phối viên duyệt BPMN điều M02 thay thế
url: "{{base_url}}/api/v1/incidents/INC-2026-001/approve-replan"
method: POST
headers:
  Authorization: Bearer {{coord_token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "option_id": "{{top_option_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      pm.test('Old shift ASG-102 is SUPERSEDED and new shift ASG-102-R1 is created', () => {
          pm.response.to.have.status(200);
          pm.expect(json.superseded_assignment_id).to.eql('ASG-102');
          pm.expect(json.new_assignment_id).to.eql('ASG-102-R1');
      });
    language: text/javascript
order: 2000
