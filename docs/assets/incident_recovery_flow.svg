    <rect x="26" y="156" width="293" height="60" rx="6" fill="#164E63" fill-opacity="0.3" stroke="#06B6D4" stroke-width="0.6"/>
    <text x="34" y="172" font-family="monospace" font-size="9" fill="#A5F3FC">Mobile Event: DRIVER_ARRIVED_FIELD</text>
    <text x="34" y="187" font-family="monospace" font-size="9" fill="#CBD5E1">Yield Collected: 7.2 tons ST25 paddy</text>
    <text x="34" y="202" font-family="monospace" font-size="9" fill="#4ADE80">Status: HARVEST_COMPLETE_SUCCESS</text>
