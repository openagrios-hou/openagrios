    <text x="122" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#CBD5E1">replan_rescue_workflow</text>
    <text x="28" y="100" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">• Người phê duyệt:</text>
