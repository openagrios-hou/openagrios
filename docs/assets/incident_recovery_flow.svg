    <text x="34" y="187" font-family="monospace" font-size="9" fill="#FDE68A">Approved: true | Reason: EMERGENCY_RESCUE</text>
    <text x="34" y="202" font-family="monospace" font-size="9" fill="#4ADE80">New Task Dispatched: ASG-102-R1</text>
