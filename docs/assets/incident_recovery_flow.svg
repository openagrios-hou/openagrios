    <text x="120" y="140" font-family="system-ui, sans-serif" font-size="10" font-weight="400" fill="#6EE7B7">PostgreSQL 16 RLS + SeaweedFS S3</text>
    <rect x="26" y="156" width="293" height="60" rx="6" fill="#064E3B" fill-opacity="0.3" stroke="#10B981" stroke-width="0.6"/>
    <text x="34" y="172" font-family="monospace" font-size="9" fill="#A7F3D0">Block #482 Sealed | PrevHash: 8b7e21a...</text>
    <text x="34" y="187" font-family="monospace" font-size="9" fill="#CBD5E1">CurrHash: f9204a8e312b918731... (VERIFIED)</text>
