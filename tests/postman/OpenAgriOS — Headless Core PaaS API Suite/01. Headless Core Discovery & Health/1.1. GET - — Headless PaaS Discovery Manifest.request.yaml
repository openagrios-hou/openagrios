$kind: http-request
name: 1.1. GET / — Headless PaaS Discovery Manifest
url: "{{base_url}}/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', () => pm.response.to.have.status(200));
      pm.test('Response is JSON Headless Manifest', () => {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
          const json = pm.response.json();
          pm.expect(json.service).to.include('Headless Core PaaS');
      });
    language: text/javascript
order: 1000
