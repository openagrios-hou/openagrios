$kind: http-request
name: "2.2. POST Login: Nông hộ Bác Ba (farmer_ba -> Lưu {{farmer_token}})"
url: "{{base_url}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "farmer_ba",
      "password": "123456"
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      pm.collectionVariables.set('farmer_token', json.access_token);
      pm.test('Issued FARMER JWT for HTX_CANTHO_01', () => {
          pm.expect(json.user.role).to.eql('FARMER');
          pm.expect(json.user.organization_id).to.eql('HTX_CANTHO_01');
      });
    language: text/javascript
order: 2000
