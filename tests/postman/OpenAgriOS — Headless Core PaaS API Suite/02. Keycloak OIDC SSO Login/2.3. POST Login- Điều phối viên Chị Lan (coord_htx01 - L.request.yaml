$kind: http-request
name: "2.3. POST Login: Điều phối viên Chị Lan (coord_htx01 -> Lưu {{coord_token}})"
url: "{{base_url}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "coord_htx01",
      "password": "123456"
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      pm.collectionVariables.set('coord_token', json.access_token);
      pm.test('Issued COORDINATOR JWT for HTX_CANTHO_01', () => {
          pm.expect(json.user.role).to.eql('COORDINATOR');
      });
    language: text/javascript
order: 3000
