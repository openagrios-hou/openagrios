$kind: http-request
name: 4.2. POST /api/v1/assignments — Xếp trùng lịch máy M01 (409 Conflict)
url: "{{base_url}}/api/v1/assignments"
method: POST
headers:
  Authorization: Bearer {{coord_token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "request_id": "REQ-04",
      "machine_id": "M01",
      "operator_id": "OP-01",
      "start_time": "2026-11-20T08:00:00Z",
      "end_time": "2026-11-20T11:30:00Z"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Overlapping shift on M01 is rejected with 409 Conflict', () => {
          pm.response.to.have.status(409);
          pm.expect(pm.response.json().error).to.eql('MACHINE_TIME_OVERLAP');
      });
    language: text/javascript
order: 2000
